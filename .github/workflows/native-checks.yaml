# The compiled-code checks from pedrobtz/r-actions, over the R test suite:
# the C++ bridge in src/*.cpp and the vendored Apache DataSketches headers it
# instantiates. gctorture has its own caller, gctorture.yaml.
on:
  # No `push:`. A pull request already checks its merge with main, and the
  # schedule checks main (r-actions README, "Pushes to main").
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The full set runs weekly and on demand:
  # `gh workflow run native-checks.yaml --ref main`.
  schedule:
    - cron: "16 2 * * 6"
  workflow_dispatch:

name: native-checks

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# `profile` goes to the three workflows it changes: quick skips the asan
# containers, valgrind and cran-special. lto, rchk and analyzers take minutes
# either way and run on every push.
jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@v1
    with:
      asan: true
      profile: auto
      # gcc 13 with the UBSan instrumentation reports -Wstringop-overflow in
      # count_min_sketch::serialize ("destination object is likely at address
      # zero"): it cannot see that the vector it writes into is non-empty. No
      # uninstrumented build warns, CRAN's gcc 16 container included, and the
      # write is in range; R CMD check would turn the warning into a WARNING.
      gcc-ubsan-flags: -Wno-stringop-overflow

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@v1
    with:
      profile: auto

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@v1

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@v1

  analyzers:
    uses: pedrobtz/r-actions/.github/workflows/analyzers.yml@v1
    with:
      # Upstream's code; the analyzers are for the package's own bridge.
      exclude: |
        src/vendor

  cran-special:
    uses: pedrobtz/r-actions/.github/workflows/cran-special.yml@v1
    with:
      profile: auto
