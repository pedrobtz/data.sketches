# R CMD check, on the GitHub runners and in the CRAN-like containers, via the
# reusable workflow in pedrobtz/r-actions. That workflow carries the reasoning;
# this file carries only what is specific to this package.
#
# The containers are what this adds. The package compiles the vendored Apache
# DataSketches C++ headers, and CRAN's two r-devel Linux flavors build them
# with clang 23 and GCC 16, which no GitHub runner carries.
#
# `runners` restores the ubuntu-latest (devel) row that the r-actions default
# drops, so every leg of the previous hand-rolled matrix still runs under the
# same name. The containers are R-devel on Linux already, but this migration
# keeps everything the old workflow checked.
#
# Dropped from the old matrix: build_args --compact-vignettes=gs+qpdf, which
# came with the r-lib template. There are no vignettes to compact.
#
# Check names now carry the caller's job id as a prefix, e.g.
# "R-CMD-check / macos-latest (release)". The main ruleset's required status
# checks must name them that way.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      runners: >-
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "devel", "http-user-agent": "release"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"}]
