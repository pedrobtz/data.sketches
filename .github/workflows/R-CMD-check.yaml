# R CMD check, on the GitHub runners and in the CRAN-like containers, via the
# reusable workflow in pedrobtz/r-actions. That workflow carries the reasoning;
# this file carries only what is specific to this package.
#
# The containers matter here: the package compiles the vendored Apache
# DataSketches C++ headers, and CRAN's r-devel Linux flavors build them with
# clang 23 and GCC 16, which no GitHub runner carries.
#
# `runners` adds the Windows R-devel row (CRAN's Windows r-devel flavor, which
# the shared default does not carry) and keeps the Ubuntu R-devel row as
# insurance against a stale container image.
on:
  # No `push:`. A pull request already checks its merge with main, and the
  # schedule checks main (r-actions README, "Pushes to main").
  # `labeled`/`unlabeled` so that adding or removing a CI label (`full-ci`,
  # `ci:minimal`, `skip-ci:<workflow>`) reruns it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The full set runs weekly and on demand:
  # `gh workflow run R-CMD-check.yaml --ref main`.
  schedule:
    - cron: "46 2 * * 6"
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # Quick on pull requests. Full on the weekly schedule, on a manual
      # dispatch, and on a pull request labelled `full-ci`.
      profile: auto
      # testthat is the only Suggests; tests/testthat.R skips without it.
      nosuggests: true
      nold: true
      runners: >-
        [{"os": "macos-latest", "r": "release"},
         {"os": "windows-latest", "r": "release"},
         {"os": "windows-latest", "r": "devel"},
         {"os": "ubuntu-latest", "r": "devel", "http-user-agent": "release"},
         {"os": "ubuntu-latest", "r": "release"},
         {"os": "ubuntu-latest", "r": "oldrel-1"}]
