# Test coverage via the reusable workflow in pedrobtz/r-actions: covr, a
# per-file table in the job summary, and the self-hosted badge. It runs the
# same covr call with the same colour thresholds as the hand-rolled job it
# replaces, so the badge figure does not move.
#
# The badge is committed to gh-pages, not main. The main ruleset requires
# pull requests, so a bot push of the badge to main is rejected; gh-pages is
# outside the ruleset and already takes the pkgdown deploy. That deploy is
# set not to force-push, or it could overwrite a badge commit landing
# mid-deploy (see pkgdown.yaml).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: coverage.yaml

# The badge job commits to the repository, and a called workflow cannot be
# granted more than its caller holds. Only the badge job takes the write
# token; covr itself runs read-only.
permissions:
  contents: write

jobs:
  coverage:
    # Pinned to a commit, not to @v1. This is the one job that runs with a
    # repository write token, and a tag can be moved. Update deliberately,
    # with the tag it corresponds to.
    uses: pedrobtz/r-actions/.github/workflows/coverage.yml@59c917ddee2cd0191f8f015016c4c76c4f2a8c87 # v1.18.0
    permissions:
      contents: write
    with:
      badge-branch: gh-pages
      badge-path: badges/coverage.svg
