# Opens an issue when Apache DataSketches C++ publishes a release newer than
# the one tools/vendor/manifest.tsv pins.
on:
  schedule:
    - cron: "56 2 * * 6"
  workflow_dispatch:

name: vendor-upstream

jobs:
  upstream:
    uses: pedrobtz/r-actions/.github/workflows/vendor-upstream.yml@v1
    permissions:
      contents: read
      issues: write
    with:
      upstream-repo: apache/datasketches-cpp
      current-version: awk -F'\t' 'NR > 1 { print $3 }' tools/vendor/manifest.tsv
      tag-pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
